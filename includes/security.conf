# Block version-control metadata directories
location ~* (?:^|/)\.(?:git|svn|hg|bzr)(?:/|$) {
    deny all;
}

# Block .env, .env.local, foo.env and foo.env.local
location ~* (?:^|/)(?:\.env|[^/]+\.env)(?:\.[^/]+)?(?:/|$) {
    deny all;
}

# Block exact, hidden and dot-prefixed deployment files
location ~* (?:^|/)(?:[^/]*\.)?(?:(?:prd|config|secret|package)\.json|(?:prd|prod|production)\.js)$ {
    deny all;
}

# Block databases, keys, certificates and configuration files
location ~* \.(?:key|pem|crt|cer|p12|pfx|asc|sql|sqlite|sqlite3|db|mdb|ini)$ {
    deny all;
}

# Block non-PHP server-side source and scripts
location ~* \.(?:asp|aspx|jsp|cgi|pl|py|rb|sh|bash|phps|inc)$ {
    deny all;
}

# Block common backup and editor files
location ~* (?:~|\.bak|\.backup|\.old|\.orig|\.save|\.sw[op])$ {
    deny all;
}

# Keep only if Markdown must never be public
location ~* \.(?:md|markdown)$ {
    deny all;
}
