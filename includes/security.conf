# Block version-control metadata
location ~* (?:^|/)\.(?:git|svn|hg|bzr) {
    deny all;
}

# Block .env variants and ordinary *.env files
location ~* (?:^|/)(?:\.env(?:\.[^/]+)?|[^/]+\.env)(?:/|$) {
    deny all;
}

# Block exact and prefixed sensitive deployment files
location ~* (?:^|/)(?:[^/]+\.)?(?:(?:prd|config|secret|package)\.json|(?:prd|prod|production)\.js)$ {
    deny all;
}

# Block databases, keys, certificates and configuration files
location ~* \.(?:key|pem|crt|cer|p12|pfx|asc|sql|sqlite|sqlite3|db|mdb|ini)$ {
    deny all;
}

# Block non-PHP server-side source and script files
location ~* \.(?:asp|aspx|jsp|cgi|pl|py|rb|sh|bash)$ {
    deny all;
}

# Optional: block common backup and editor files
location ~* (?:~|\.bak|\.old|\.orig|\.save|\.swp)$ {
    deny all;
}

# Optional: block Markdown only if the website never serves it
location ~* \.(?:md|markdown)$ {
    deny all;
}
