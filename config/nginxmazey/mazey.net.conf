# Define the variable
map $host $i_base_url {
    default http://i.mazey.net;
}

map $host $blog_base_url {
    default http://blog.mazey.net;
}

server {
    listen 80;
    server_name mazey.net www.mazey.net kb.mazey.net dev.mazey.net;
    root /web/mazey/www;
    index index.html;

    location = / {
        return 301 http://mazey.cn/index.html;
    }

    # Blog - Post
    # http://www.mazey.net/baby/blog/archives/1583
    if ($request_uri ~* ^/baby/blog/archives/\d*.*$) {
        rewrite ^/baby/blog/archives/(\d*)$ $blog_base_url/$1.html permanent;
    }
    # Home
    # http://www.mazey.net/baby/blog/
    if ($request_uri ~* ^/baby/blog[/]?$) {
        rewrite ^/baby/blog[/]?$ $blog_base_url/ permanent;
    }
    # Category
    # http://www.mazey.net/baby/blog/archives/category/javascript
    if ($request_uri ~* ^/baby/blog/archives/[a-zA-Z]*/.*$) {
        rewrite ^/baby/blog/archives/([a-zA-Z]*/.*)$ $blog_base_url/$1 permanent;
    }
    # Pagination
    # http://www.mazey.net/baby/blog/page/2
    if ($request_uri ~* ^/baby/blog/page/\d*.*$) {
        rewrite ^/baby/blog/page/(\d*)$ $blog_base_url/page/$1 permanent;
    }
    # Migrate /baby/ -> /app/
    # http://www.mazey.net/baby/blog/archives/date/2017/04
    if ($request_uri ~* ^/baby/.*$) {
        rewrite ^/baby/(.*)$ http://www.mazey.net/app/$1 permanent;
    }

    # /app/
    # http://www.mazey.net/app/remind/
    if ($request_uri ~* ^/app/(remind|sakura|share|speech)/.*$) {
        rewrite ^/app/(.*)$ $i_base_url/x/$1 permanent;
    }
    # http://www.mazey.net/app/visitor/
    if ($request_uri ~* ^/app/(shuxin|visitor|xueyuting)/.*$) {
        rewrite ^/app/(.*)$ $i_base_url/x/p/$1 permanent;
    }
    # http://www.mazey.net/app/douban-bootstrap/lesson-first-waterfall/index.html
    if ($request_uri ~* ^/app/douban-bootstrap/.*$) {
        rewrite ^/app/douban-bootstrap/(.*)$ $i_base_url/bootstrap-blueprints/$1 permanent;
    }

    # kb.mazey.net
    # http://kb.mazey.net/
    if ($host ~* ^kb.mazey.net$) {
        rewrite ^(.*)$ $i_base_url/x/kb$1 permanent;
    }

    include /web/conf/includes/security.conf;
    include /web/conf/includes/static.conf;
}
