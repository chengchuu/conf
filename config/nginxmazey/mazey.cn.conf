# Define the variable
map $host $i_base_url_b {
    default https://i.mazey.net;
}

# Previous Server
upstream node-server {
    server webnode:3000;
}

upstream go-gin-gee-b {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name mazey.cn www.mazey.cn dev.mazey.cn;
    root /web/mazey.cn;
    index index.html index.htm;
    client_max_body_size 200m;

    # /feperf/ Redirect
    location ^~ /feperf/ {
        return 301 $i_base_url_b$request_uri;
    }

    # /workspace/ Removed
    location ^~ /workspace/ {
        root /web;
        try_files /x/base/content-removed.html =404;
    }

    # /docs/mazey/
    location ^~ /docs/mazey/ {
        alias /web/lib/mazey/docs/v3/;
    }

    # /bootstrap-blueprints/
    location ^~ /bootstrap-blueprints/ {
        alias /web/chengchuu/bootstrap-blueprints/;
    }

    # /tsj/
    location ^~ /tsj/ {
        alias /web/icon/tsj/;
    }

    # Archived
    location ^~ /cdn/ {
        alias /web/archives/cdn/;
    }
    location ^~ /asset/ {
        alias /web/archives/asset/;
        error_page 404 = @asset_404;
        access_log /var/log/web/nginx_asset_access.log;
    }

    # /server/
    location ^~ /server/data/ {
        alias /web/archives/server/data/;
    }
    location ^~ /server/ {
        proxy_http_version 1.1;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    Host  $http_host;
        proxy_set_header    X-Nginx-Proxy true;
        proxy_set_header    Connection "";
        proxy_pass http://node-server;
    }
    location ^~ /t/ {
        if ($request_uri = /t/bqm) {
            return 404;
        }
        proxy_http_version 1.1;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    Host  $http_host;
        proxy_set_header    X-Nginx-Proxy true;
        proxy_set_header    Connection "";
        proxy_pass http://go-gin-gee-b;
    }

    # Redirect
    location = /b {
        return 302 http://blog.mazey.net/;
    }
    location = /l {
        return 302 http://blog.mazey.net/link;
    }
    location = /s {
        return 302 http://blog.mazey.net/search-next;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /web/x/base;
        internal;
    }

    include /web/conf/includes/security.conf;
    include /web/conf/includes/static.conf;
    include /web/conf/includes/access-control-allow-origin-all.conf;
}

# CROS: CDN > Advanced Config > HTTP Response Header Config
