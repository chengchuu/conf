upstream node-koa-rain-a {
    server webnode:3224;
}

upstream go-gin-gee-a {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name i.mazey.net devi.mazey.net;
    root /web/x/i-mazey-net;
    index index.html index.htm;
    client_max_body_size 200m;

    # /chengchuu/
    # /bootstrap-blueprints/
    location ^~ /bootstrap-blueprints/ {
        alias /web/chengchuu/bootstrap-blueprints/;
    }
    # /gallery/
    location ^~ /gallery/ {
        alias /web/chengchuu/gallery/dist/;
    }
    # /json-to-resume/
    location ^~ /json-to-resume/ {
        alias /web/chengchuu/json-to-resume/dist/;
    }
    # /new-typescript-project/
    location ^~ /new-typescript-project/ {
        alias /web/chengchuu/new-typescript-project/site-dist/;
    }
    # /metro/
    location ~ ^/subway/operation/[^/]+/(.*)$ {
        return 301 /metro/$1$is_args$args;
    }
    location ^~ /metro/ {
        alias /web/chengchuu/shanghai-subway-operation-view/build/;
    }
    # /vue-china-map/
    # location ^~ /vue-china-map/ {
    #     alias /web/chengchuu/vue-china-map/dist/;
    # }

    # /feperf/
    location ^~ /feperf/sdk/ {
        alias /web/x/feperf/sdk/;
    }
    location ^~ /feperf/ {
        proxy_http_version 1.1;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    Host  $http_host;
        proxy_set_header    X-Nginx-Proxy true;
        proxy_set_header    Connection "";
        proxy_pass http://node-koa-rain-a;
    }

    # Archived
    location ^~ /static/ {
        alias /web/archives/static/;
    }
    location ^~ /mazey-style/ {
        alias /web/archives/mazey-style/;
    }
    location ^~ /asset/ {
        alias /web/archives/asset/;
        error_page 404 = @asset_404;
        access_log /var/log/web/nginx_asset_access.log;
    }
    location ^~ /assets/ {
        alias /web/archives/asset/;
        error_page 404 = @asset_404;
        access_log /var/log/web/nginx_asset_access.log;
    }
    location ^~ /cdn/ {
        alias /web/archives/cdn/;
        error_page 404 = @lib_404_redirect;
    }

    # /polestar/
    location = /polestar/lib/tiny.css {
        return 301 /style/lib/tiny.css;
    }
    location ^~ /polestar/ {
        alias /web/npm/mazey-polestar/;
    }

    # /style/
    location ^~ /style/ {
        alias /web/npm/mazey.css/;
    }

    # /icon/
    location ^~ /icon/ {
        alias /web/icon/;
    }

    # /lib/
    location ^~ /lib/ {
        alias /web/lib/;
        error_page 404 = @lib_404_redirect;
        expires 24h;
    }
    location @lib_404_redirect {
        return 302 /lib/all.js;
    }

    # Redirect to http://i.mazey.net/mazey/docs/index.html when 404
    location ^~ /mazey/docs/ {
        alias /web/lib/mazey/docs/v3/;
        error_page 404 = @mazey_docs_404_redirect;
    }
    location @mazey_docs_404_redirect {
        return 302 /mazey/docs/index.html;
    }

    # /api/
    location ~ ^/(api|t)/ {
        proxy_http_version 1.1;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    Host  $http_host;
        proxy_set_header    X-Nginx-Proxy true;
        proxy_set_header    Connection "";
        proxy_pass http://go-gin-gee-a;
    }
    # /log/
    location = /log/robot.html {
        root /web;
    }
    location ^~ /log/ {
        return 403;
    }

    # /server/
    location ^~ /server/ {
        proxy_http_version 1.1;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    Host  $http_host;
        proxy_set_header    X-Nginx-Proxy true;
        proxy_set_header    Connection "";
        proxy_pass http://node-koa-rain-a;
    }

    # /x/
    # Redirect from /x/
    location = /x/p/shuxin/index.php {
        return 301 /x/p/shuxin/index.html;
    }
    location = /x/p/shuxin/about.php {
        return 301 /x/p/shuxin/about.html;
    }
    # Main
    location ^~ /x/douban-bootstrap/ {
        alias /web/chengchuu/bootstrap-blueprints/;
    }
    location ^~ /x/markdown/ {
        alias /web/chengchuu/mazey-tool/dist/markdown/;
    }
    location ^~ /x/nut-read-manager/ {
        alias /web/chengchuu/mazey-tool/dist/nut-read-manager/;
    }
    location ^~ /x/metro/ {
        alias /web/chengchuu/shanghai-subway-operation-view/build/;
    }
    location ^~ /x/mazey-workspace/ {
        alias /web/chengchuu/mazey-workspace-fe/build/;
    }
    # location ^~ /x/resume/ {
    #     alias /web/chengchuu/json-to-resume/dist/;
    # }
    # location ^~ /x/vue-china-map/ {
    #     return 301 /vue-china-map/;
    # }
    location ^~ /x/ {
        alias /web/x/;
        expires 24h;
    }
    # Redirect to /x/
    location ~ ^/p/(.*)$ {
        return 301 /x/p/$1;
    }
    location ~ ^/tool/(.*)$ {
        return 301 /x/$1;
    }

    # Blog Uploads
    # https://i.mazey.net/uploads /web/blog-mazey-net/wp-content/uploads
    location ~ ^/uploads/(.*)$ {
        root /web/blog-mazey-net/wp-content;
        try_files /uploads/$1 /uploads/$1/ /uploads/$1/index.html =404;
    }

    # Redirect: https://i.mazey.net/mazey/lib/mazey.min.js -> https://i.mazey.net/lib/mazey/latest/mazey.min.js
    location = /mazey/lib/mazey.min.js {
        return 301 https://i.mazey.net/lib/mazey/latest/mazey.min.js;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /web/x/base;
        internal;
    }

    include /web/conf/includes/security.conf;
    include /web/conf/includes/static.conf;
    include /web/conf/includes/access-control-allow-origin-all.conf;
    include /web/conf/includes/gzip.conf;
}
